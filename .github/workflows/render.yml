name: Render video

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Composition ID to render (see remotion list)"
        required: true
        default: "Screencast"
      scale:
        description: "Render scale (1 = 1920x1080, 1.5 = 2880x1620, much slower)"
        required: true
        default: "1"
      crf:
        description: "Quality: CRF (18 = high, 23 = medium)"
        required: true
        default: "20"
      concurrency:
        description: "Parallel browser tabs (4 vCPU / 16 GB runner; try 2, then 3)"
        required: true
        default: "2"
      gl:
        description: "OpenGL renderer (angle for Three.js/WebGL, swiftshader for software)"
        required: true
        default: "angle"

jobs:
  render:
    runs-on: ${{ inputs.composition == 'Stickman' && fromJSON('["self-hosted", "Windows", "X64", "stickman"]') || 'ubuntu-latest' }}
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (self-hosted)
        if: ${{ inputs.composition == 'Stickman' }}
        run: |
          node --version
          npm --version

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci 2>&1 | Select-Object -Last 5

      - name: Install Remotion browser (Chrome Headless Shell)
        if: ${{ inputs.composition != 'Stickman' }}
        run: npx remotion browser ensure

      - name: Render
        env:
          COMPOSITION: ${{ inputs.composition }}
          SCALE: ${{ inputs.scale }}
          CRF: ${{ inputs.crf }}
          CONCURRENCY: ${{ inputs.concurrency }}
          GL: ${{ inputs.gl }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $env:CI = "false"
          Measure-Command {
            npx remotion render "$env:COMPOSITION" "out/$env:COMPOSITION.mp4" --scale="$env:SCALE" --crf="$env:CRF" --concurrency="$env:CONCURRENCY" --gl="$env:GL" 2>&1 | Tee-Object -FilePath "render.log"
          } | Select-Object TotalMinutes

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendered-${{ inputs.composition }}
          path: |
            out/*.mp4
            render.log
          retention-days: 7